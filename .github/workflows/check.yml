name: Check installer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -s sh install.sh smoke-test.sh
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["alpine:3.22", "debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install, migrate and check dual stack
        run: docker run --rm --sysctl net.ipv6.conf.all.disable_ipv6=0 -v "$PWD:/src:ro" ${{ matrix.image }} sh /src/smoke-test.sh

